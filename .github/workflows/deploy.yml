name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/soccer-score-tracker-pwa-b8zna
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write  # gh-pages needs to push to the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true   # keeps gh-pages branch lean (single commit)
